<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
      <title>Spring Boot</title>
</head>
<body>
   <h3>Access Denied Exception</h3>
   <div th:if="${user}">
	    Logged in user: <b th:text="${user}"> [[${user}]] </b>
	    <form th:action="@{/logout}" method="POST">
	         <input type="submit" value="Logout"/>
	    </form>
   </div> 	 
    <p class="error">
        Code erreur : <b th:text="${errorCode}">500</b><br/>
        Message : <span th:text="${errorMsg}">Message d'erreur</span>
   </p>
</body>
</html>
